services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    env_file: [../../.env.example]
    depends_on: [postgres, redis]
    ports: ["8000:8000"]
  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    env_file: [../../.env.example]
    depends_on: [postgres, redis]

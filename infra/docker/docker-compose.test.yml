services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: erp_test
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
  redis:
    image: redis:7
  tests:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    command: ["pytest", "-m", "unit or integration", "tests/"]
    depends_on: [postgres, redis]

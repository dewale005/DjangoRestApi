apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-api
spec:
  replicas: 3
  selector:
    matchLabels: {app: erp-api}
  template:
    metadata:
      labels: {app: erp-api}
    spec:
      containers:
        - name: api
          image: ghcr.io/org/erp-api:latest
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
          livenessProbe:
            httpGet: {path: /health/live, port: 8000}

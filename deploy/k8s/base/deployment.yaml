apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-rest-api
  labels:
    app: django-rest-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django-rest-api
  template:
    metadata:
      labels:
        app: django-rest-api
    spec:
      containers:
        - name: django-rest-api
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: webapp.settings
            - name: ALLOWED_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: django-rest-api-config
                  key: ALLOWED_HOSTS
          readinessProbe:
            httpGet:
              path: /users/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /users/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
